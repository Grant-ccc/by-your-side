name: Build and MySQL integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: by_your_side_test
          MYSQL_USER: by_your_side
          # Disposable credentials for this isolated CI service, not deployment secrets.
          MYSQL_PASSWORD: ci-test-only-local
          MYSQL_ROOT_PASSWORD: ci-root-only-local
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3307
      DB_NAME: by_your_side_test
      DB_USER: by_your_side
      DB_PASSWORD: ci-test-only-local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run db:migrate
      - name: Verify migration is repeatable
        run: npm run db:migrate
      - run: npm run test:db
