name: by-your-side-dev
services:
  mysql:
    image: mysql:8.4
    ports:
      - '127.0.0.1:${DB_PORT:-3307}:3306'
    environment:
      MYSQL_DATABASE: ${DB_NAME:?Run npm run setup:local first}
      MYSQL_USER: ${DB_USER:?Run npm run setup:local first}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Run npm run setup:local first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run npm run setup:local first}
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_0900_ai_ci']
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h 127.0.0.1 -u$$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
volumes:
  mysql-data:
