<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#a33232"><title>在你身边 · 交互原型</title><link rel="stylesheet" href="style.css"></head>
<body>
<aside class="studio"><div class="eyebrow">PRIVATE DAYS / 01</div><h1>在你身边<span>让平常的日子，<br>慢慢成为回忆。</span></h1><p>暖酒红 · 手机交互原型</p><div class="studio-line"></div><p class="description">沿用你喜欢的日常面板，<br>也留一处随时能说话的地方。</p><div id="desktop-controls"></div><p class="studio-note">本地示例数据 · 无 AI 调用<br>头像和相册为示意，可随时重置。</p></aside>
