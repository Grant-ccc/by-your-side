else{inside=[{x:200,c:'#a33232'},{x:400,c:'#f5e7d3'}].map(o=>`<ellipse cx="${o.x}" cy="310" rx="93" ry="13" fill="#b79b89"/><path d="M${o.x+47} 213c78-15 77 80 0 65" fill="none" stroke="${o.c}" stroke-width="18"/><rect x="${o.x-58}" y="208" width="116" height="93" rx="19" fill="${o.c}"/><ellipse cx="${o.x}" cy="211" rx="56" ry="17" fill="#e6c6a4"/>`).join('')+'<path d="M200 175c-30-30 20-35 0-65" fill="none" stroke="#fff7ec" stroke-width="6" stroke-linecap="round"/>';}
return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">${backdrop}${inside}</svg>`)}
const seed=()=>({version:1,profile:{you:'你',him:'李泽言',birthday:'',anniversary:'',sleep:'23:00',wake:'07:30'},scenario:'normal',companion:false,mood:'今天也有一点想你',habits:[{id:1,name:'喝水',count:3},{id:2,name:'运动',count:0},{id:3,name:'睡觉',count:0}],messages:[{id:1,role:'you',text:'刚下课，今天终于把那个 bug 找到了！',read:true},{id:2,role:'him',text:'找了一上午？'},{id:3,role:'him',text:'那先让脑袋休息一会儿。午饭吃什么？'},{id:4,role:'you',text:'还没想好，你吃了吗？',read:true},{id:5,role:'him',text:'刚吃过。今天换你关心我了？'}],memories:[{id:1,text:'饮料偏好不太甜',source:'示例聊天',kind:'普通偏好'}],pending:[{id:1,text:'明晚 20:00 一起看电影',type:'promise'}],notes:[{id:1,title:'课程安排',time:'周五 09:00',kind:'我的安排'},{id:2,title:'完成课程作业',time:'周五 16:00',kind:'我的安排'}],promises:[],item:'umbrella',carrying:'umbrella',events:[{time:'09:10',text:'开始处理今天的工作'},{time:'10:00',text:'会议进行中'},{time:'11:30',text:'午间休息，稍后回来'}],photos:[{id:1,title:'留给你的那一杯',caption:'晚间的小约定，留一段共同想象的时光。',date:'10.15',kind:'cups'},{id:2,title:'棉花娃娃的合照',caption:'形象待设计；这里先看合照的构图。',date:'较早的示例回忆',kind:'dolls'},{id:3,title:'他路过的傍晚',caption:'沿途的风景，也想分享给你。',date:'较早的示例回忆',kind:'sky'}],week:1,budget:{limit:50,used:12.6},tripRun:0});
let state;try{const saved=JSON.parse(localStorage.getItem(KEY));state=saved&&saved.version===1?saved:seed()}catch{state=seed()}
let view='home',tab='日常记录',memoryFilter='all',albumFilter='all',typing=false,replyTimer=null,pendingIds=[],toastTimer;
const screen=$('#screen');
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{toast('浏览器存储不可用，当前修改未能保存')}}
function toast(s){$('#toast').textContent=s;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),2800)}
function endWork(){clearTimeout(replyTimer);replyTimer=null;typing=false;pendingIds=[]}
function nav(to){view=to;closeModal();render()}
function name(){return esc(state.profile.him||'李泽言')}
function pageHeader(title,sub='',back='home',right='settings'){return `<header class="topbar"><button class="icon-button" data-go="${back}" aria-label="返回">${icon('back')}</button><div class="title-block"><h2>${title}</h2>${sub?`<small>${sub}</small>`:''}</div><button class="icon-button" data-go="${right}" aria-label="设置">${icon('gear')}</button></header>`}
function panel(title,body,right=''){return `<section class="panel"><div class="panel-header"><span>${title}</span>${right}</div>${body}</section>`}
function status(){return state.companion?'这会儿，我听你说':state.scenario==='busy'?'会议中 · 忙完会回来':state.scenario==='read'?'正在处理工作 · 稍后回复':'午间休息 · 可以聊一会儿'}
function scenarioButtons(){return `<div class="scenario-title">体验不同状态</div><div class="scenario-buttons"><button data-demo="normal">日常聊天</button><button data-demo="busy">忙碌未读</button><button data-demo="read">已读等待</button><button data-demo="companion">需要陪伴</button><button data-demo="notification">锁屏通知</button><button data-demo="budget">预算用尽</button><button data-demo="empty">空白相册</button><button data-demo="reset">重置示例</button></div>`}
$('#desktop-controls').innerHTML=scenarioButtons();
$('#mobile-demo').onclick=()=>showModal('演示不同状态',`<div class="scenario-panel">${scenarioButtons()}</div>`);
function home(){const p=state.profile;let days='慢慢收藏';if(p.anniversary){const diff=Math.floor((Date.now()-new Date(p.anniversary+'T00:00:00').getTime())/86400000)+1;if(diff>0)days=`第 ${diff} 天`;}
return `<header class="topbar"><div class="home-title"><button class="icon-button" data-go="home" aria-label="日常主页">${icon('home')}</button><h2>在你身边</h2></div><button class="icon-button" data-go="settings" aria-label="设置">${icon('gear')}</button></header><div class="page-scroll"><section class="pair"><div class="pair-faces"><div class="person">${avatar()}<strong>${name()}</strong></div><span class="pair-heart">♥</span><div class="person">${avatar('you')}<strong>${esc(p.you||'你')}</strong></div></div><div class="pair-copy"><small>相伴的日常</small><h3>${days}</h3><button class="pill" data-go="settings">${p.anniversary?'关于我们':'称呼与日期待填写'}</button></div></section><div class="tabs" role="tablist">${['日常记录','习惯打卡','备忘录'].map(t=>`<button role="tab" aria-selected="${tab===t}" class="${tab===t?'active':''}" data-tab="${t}">${t}</button>`).join('')}</div>${tab==='日常记录'?daily():tab==='习惯打卡'?habits():memos()}<div class="mini-portrait-note">头像为临时示意 · 角色形象以后替换</div></div>`}
function daily(){return panel('此时此刻',`<div class="mood-card"><div class="mood-face">♥</div><div><h3>${esc(state.mood)}</h3><p class="muted">把心情留在这里，他会看见。</p><button class="pill" data-action="mood">记录心情 ＋</button></div></div>`,'<small>今天</small>')+panel('最新动态',`<div class="timeline">${state.events.slice(-3).map(e=>`<div class="timeline-row"><time>${esc(e.time)}</time><span>${esc(e.text)}</span></div>`).join('')}</div>`,`<button data-go="timeline">查看全部 ›</button>`)+panel('出行准备',`<div class="trip-row"><button class="trip-mini" data-go="trip"><small>本次外出</small><span class="item-symbol">${items[state.carrying].symbol}</span><span>${items[state.carrying].name} · 携带中</span></button><button class="trip-mini" data-go="trip"><small>下次外出</small><span class="item-symbol">＋</span><span>为他选一件物品</span></button></div>`)}
function habits(){return panel('习惯打卡',`${state.habits.map(h=>`<div class="habit"><span class="habit-icon ${h.count?'done':''}">${icon(h.count?'check':h.name.includes('水')?'water':h.name.includes('睡')?'moon':'clock')}</span><div class="habit-body"><h3>${esc(h.name)}</h3><small>${h.count?`今天已记录 ${h.count} 次`:'按你的方式，慢慢来'}</small></div><button data-check="${h.id}">记录 ＋</button></div>`).join('')}<button class="secondary full" data-action="add-habit">＋ 添加自己的习惯</button>`,'<small>自己决定节奏</small>')+`<div class="soft-note">没打卡也不代表没完成。习惯是你自己的，他会温和地关心。</div>`}
function memos(){return panel('两人的备忘录',`<div class="panel-content">${state.promises.length?state.promises.map(n=>`<div class="note-row"><div><span class="pill">共同约定</span><h3>${esc(n.title)}</h3><p class="muted">${esc(n.time)}</p><p class="success-text">✓ 已确认，日程已留出时间</p></div></div>`).join(''):`<span class="pill">待你确认的约定</span><h3>明晚一起看一部电影</h3><p class="muted">在聊天中说起，再把时间一起定下来。</p><button class="secondary full section-gap" data-go="memory">去确认约定</button>`}</div>`)+panel('我的安排',`<div class="panel-content">${state.notes.map(n=>`<div class="note-row"><div><small>${esc(n.time)} · ${esc(n.kind)}</small><h3>${esc(n.title)}</h3></div><button data-delete-note="${n.id}" aria-label="删除${esc(n.title)}">删除</button></div>`).join('')}<button class="secondary full section-gap" data-action="add-note">＋ 课表 / 考试 / 待办</button></div>`)}
function chat(){const stop=state.scenario==='budget';return pageHeader(name(),status(),'home')+(!state.companion&&['busy','read'].includes(state.scenario)?`<div class="chat-banner">${state.scenario==='busy'?'他正在忙，消息已经送达':'已读 · 暂未回复'}<small>演示中会保持等待，点击下方“忙完回来”继续。</small><button class="text-button" data-action="return">忙完回来 →</button></div>`:'')+(state.companion?'<div class="chat-banner">正在陪伴你<small>暂时放下普通日程里的等待。</small></div>':'')+`<div class="chat-history" id="chat-history"><div class="chat-date">今天 · 示例会话</div>${state.messages.map(m=>message(m)).join('')}${stop?`<div class="budget-callout"><span class="pill">系统提示</span><h3>本月额度已到上限</h3><p class="muted">新的付费生成已暂停。已有聊天、相册和日程仍可查看。</p><button class="secondary full" data-go="settings">查看用量与设置</button></div>`:''}${typing?'<div class="typing"><span>···</span> 正在输入（示例回复）</div>':''}</div><div class="chat-tools"><button data-action="companion">${state.companion?'结束陪伴':'现在想找你'}</button><button data-action="take-photo">我们拍一张</button></div><form class="composer" id="chat-form"><input name="message" id="message-input" aria-label="聊天消息" placeholder="${stop?'额度已用尽 · 可查看历史':'想和他说点什么…'}" autocomplete="off" maxlength="600" ${stop?'disabled':''}><button class="primary" ${stop?'disabled':''}>发送</button></form>`}
function message(m){if(m.role==='system')return `<div class="message system"><div class="bubble">${esc(m.text)}</div></div>`;const last=state.messages.filter(x=>x.role==='him').at(-1);const canRetry=m.role==='him'&&last?.id===m.id&&state.messages.at(-1)?.role==='him';return `<div class="message ${m.role}" data-message-id="${m.id}">${avatar(m.role==='you'?'you':'him')}<div class="message-body"><div class="bubble">${esc(m.text)}</div>${m.role==='you'?`<div class="message-state">${m.read?'已读':'未读'}</div>`:''}${canRetry?`<button class="message-action" data-retry="${m.id}">重新回复 ↻</button>`:''}</div></div>`}
const items={umbrella:{name:'折叠伞',symbol:'☂',description:'如果沿途遇到雨，他也可以多走一段喜欢的路。',event:'路上下起小雨。带着你选的伞，走到了街角那家小店。',message:'回去的路上下了点雨。你挑的伞用上了。小店里看到一对杯子，记下来，下次一起挑。'},cup:{name:'随行杯',symbol:'♧',description:'带一杯熟悉的味道，在外出的间隙歇一会儿。',event:'带着随行杯，在临窗的长椅边休息片刻。',message:'今天带了随行杯。路过一处很安静的小花园，下次想让你也看看。'},pen:{name:'钢笔',symbol:'✎',description:'随手记下沿途的一个念头，也可能是一张留给你的纸条。',event:'路过书店，用携带的钢笔在书签上写下一句留言。',message:'书店里挑了张书签。你选的笔写起来不错，顺便留了一句话，先不告诉你。'},camera:{name:'相机',symbol:'▣',description:'把沿途喜欢的风景留下，回来慢慢分享。',event:'携带相机经过海边，留下了傍晚天色的回忆。',message:'沿途的天色很好。带了相机，记下了一个想分享给你的傍晚。'}};
function trip(){const item=items[state.item];return pageHeader('为他准备出行','下次外出 · 傍晚散步')+`<div class="page-scroll"><div class="page-intro"><h3>放一件小物品进他的行李</h3><p class="muted">不同的准备，会留下不同的见闻。</p></div><div class="items-grid">${Object.entries(items).map(([id,it])=>`<button class="item-card ${id===state.item?'selected':''}" data-item="${id}" aria-pressed="${id===state.item}">${id===state.item?'<span class="selected-mark">✓</span>':''}<span class="item-symbol">${it.symbol}</span><strong>${it.name}</strong></button>`).join('')}</div><div class="section-gap">${panel(item.name,`<div class="item-description">${item.description}<p class="muted section-gap">或许，会带回一段意料之外的小故事。</p></div>`)}</div><button class="primary full" data-action="carry">就带上这件</button><button class="secondary full section-gap" data-action="trip-preview">演示一次出行见闻</button><p class="muted section-gap">原型会立即演示结果，正式版按日程发生。</p></div>`}
function gallery(){let photos=albumFilter==='items'?state.photos.filter(p=>p.kind==='cups'):state.photos;return pageHeader('两人的相册','把平常的日子，慢慢留下来')+`<div class="page-scroll"><div class="filter-row"><div><button class="pill" data-album="all">全部回忆</button> <button class="pill" data-album="items">物件</button></div><span class="pill">本周 ${state.week} / 2</span></div><p class="scene-label">以下为构图示意，非 AI 生成结果</p>${photos.length?`<div class="gallery-grid">${photos.map(p=>`<button class="photo-card" data-photo="${p.id}"><img src="${art(p.kind)}" alt="${esc(p.title)}的构图示意"><strong>${esc(p.title)}</strong><small>${esc(p.date)}</small></button>`).join('')}</div>`:`<div class="empty-state">${icon('album')}<h3>第一段回忆，正在路上</h3><p class="muted">日常里的小事，也值得留下。</p><button class="primary" data-go="chat">去和他说说话</button></div>`}<button class="secondary full section-gap" data-action="take-photo">留下一张回忆</button><div class="soft-note">事件可以自然带来照片，也可以由你提出。每周最多两张，预算不足时暂停；原型只添加示意图。</div></div>`}
function memory(){return pageHeader('关于你的记忆','记得你，也听你的纠正')+`<div class="page-scroll"><div class="filter-row"><button class="pill" data-memory-filter="all">已记住 ${state.memories.length}</button><button class="pill" data-memory-filter="pending">待确认 ${state.pending.length}</button></div>${memoryFilter==='all'?state.memories.map(m=>`<section class="memory-card"><span class="pill">${esc(m.kind)} · 已保存</span><h3>${esc(m.text)}</h3><p class="muted">来自${esc(m.source)}</p><div class="memory-actions"><button data-edit-memory="${m.id}">修改</button><button data-delete-memory="${m.id}">删除</button></div></section>`).join(''):''}${state.pending.map(m=>`<section class="memory-card pending"><span class="pill">${m.type==='promise'?'重要约定':'不确定内容'} · 等你确认</span><h3>${esc(m.text)}</h3><div class="button-row"><button class="primary" data-confirm="${m.id}">确认${m.type==='promise'?'约定':'保存'}</button><button class="secondary" data-dismiss="${m.id}">暂不保存</button></div></section>`).join('')}${!state.memories.length&&!state.pending.length?'<div class="empty-state"><h3>慢慢了解你</h3><p class="muted">记忆会在聊天中积累，你随时能纠正。</p></div>':''}<div class="soft-note">普通偏好自动保存并提示；重要约定和关系变化需要确认。当前为示例数据，不会连接模型或上传内容。</div></div>`}
function timeline(){return pageHeader('他的日常','各自有生活，也分享给彼此')+`<div class="page-scroll"><div class="page-intro"><span class="pill">${esc(status())}</span></div>${panel('今天的记录',`<div class="timeline">${state.events.map(e=>`<div class="timeline-row"><time>${esc(e.time)}</time><span>${esc(e.text)}</span></div>`).join('')}</div>`)}<button class="secondary full" data-go="trip">看看下次出行准备</button><div class="soft-note">聊天、日程和物品事件使用同一组示例记录。</div></div>`}
function settings(){const p=state.profile,b=state.budget;return pageHeader('我们的设置','慢慢填，也可以以后再改')+`<div class="page-scroll"><form id="profile-form"><section class="settings-group"><h3>称呼与纪念日</h3><label class="field">他怎么称呼你<input name="you" value="${esc(p.you)}" maxlength="20"></label><label class="field">他的显示名字<input name="him" value="${esc(p.him)}" maxlength="20"></label><label class="field">你的生日<input type="date" name="birthday" value="${esc(p.birthday)}"></label><label class="field">恋爱纪念日<input type="date" name="anniversary" value="${esc(p.anniversary)}"></label></section><section class="settings-group"><h3>他的大致作息</h3><label class="field">开始一天<input type="time" name="wake" value="${esc(p.wake)}"></label><label class="field">准备休息<input type="time" name="sleep" value="${esc(p.sleep)}"></label><p class="muted">原型保存偏好；实际日程生成在后续接入。</p></section><button class="primary full">保存设置</button></form><section class="settings-group"><h3>用量与费用 · 演示数字</h3><div class="budget-numbers"><span>本月总运行预算</span><strong>${b.used.toFixed(2)} / ${b.limit} 元</strong></div><div class="progress"><div style="width:${Math.min(100,b.used/b.limit*100)}%"></div></div><p class="muted">本周示意照片 ${state.week} / 2 张<br>无真实消费。接近上限先停图片，上限后停新生成。</p></section><section class="settings-group"><h3>记忆与数据</h3><button class="secondary full" data-go="memory">查看与纠正记忆</button><div class="button-row"><button class="secondary" data-action="export">导出备份</button><button class="secondary" data-action="import">恢复备份</button></div><p class="muted section-gap">数据只保存在当前浏览器。备份是含示意图片的 JSON 文件，不含 API 密钥。</p><input class="restore-input" id="restore-file" type="file" accept="application/json,.json"></section><section class="settings-group"><h3>原型演示</h3>${scenarioButtons()}<button class="text-button section-gap" data-demo="notification">查看锁屏通知示意 →</button></section></div>`}
function render(){screen.innerHTML=({home,chat,trip,gallery,memory,timeline,settings}[view]||home)();$('.bottom-nav').innerHTML=[['home','home','日常'],['chat','chat','聊天'],['gallery','album','回忆']].map(([id,ic,t])=>`<button data-go="${id}" class="${view===id||(id==='home'&&['trip','timeline'].includes(view))?'active':''}" aria-label="${t}">${icon(ic)}<span>${t}</span></button>`).join('');if(view==='chat'){$('#chat-history').scrollTop=$('#chat-history').scrollHeight;$('#chat-form').addEventListener('submit',send)}if(view==='settings'){$('#profile-form').addEventListener('submit',saveProfile);$('#restore-file').addEventListener('change',restore)}persist()}
function showModal(title,body){const el=$('#overlay');el.hidden=false;el.innerHTML=`<section role="dialog" aria-modal="true" aria-label="${esc(title)}" class="modal"><div class="modal-header"><h3>${title}</h3><button class="icon-button" data-action="close" aria-label="关闭">${icon('close')}</button></div>${body}</section>`;el.querySelector('button,input')?.focus()}
function closeModal(){$('#overlay').hidden=true;$('#overlay').innerHTML=''}
$('#overlay').addEventListener('click',e=>{if(e.target===$('#overlay'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function addMessage(role,text,extra={}){const m={id:Date.now()+Math.random(),role,text,...extra};state.messages.push(m);return m}
function markRead(){state.messages.filter(m=>m.role==='you').forEach(m=>m.read=true)}
function response(text){if(/电影|明晚|约定/.test(text)){return ['好。想几点开始？','把时间定下来，我会留出来。']}if(/难受|陪我|好烦|累了|不开心/.test(text))return ['好，先不讲道理。','想说就说，我听着。'];if(/喜欢|饮料|甜/.test(text))return ['记下了。下次挑的时候，按你的口味来。'];if(/吃|午饭|晚饭/.test(text))return ['刚忙完，正准备吃。','你呢，今天有没有吃到喜欢的东西？'];if(/想你/.test(text))return ['嗯，我也想你。','刚才路过一家小店，看到点想和你分享的东西。'];return ['看到了。','原型先用这组示例回应；你的话已经保留，正式版会由 AI 接着聊。']}
function queueReply(){if(replyTimer)clearTimeout(replyTimer);if(['busy','read'].includes(state.scenario)&&!state.companion){if(state.scenario==='read')markRead();render();return}typing=true;markRead();render();replyTimer=setTimeout(()=>{typing=false;replyTimer=null;const waiting=state.messages.filter(m=>pendingIds.includes(m.id));const text=waiting.map(m=>m.text).join(' ');pendingIds=[];response(text).forEach(t=>addMessage('him',t));if(view==='chat')render();else persist()},1600)}
function send(e){e.preventDefault();const input=$('#message-input');const text=input.value.trim();if(!text)return;if(state.scenario==='budget'){toast('演示额度已用尽');return}const m=addMessage('you',text,{read:false});pendingIds.push(m.id);if(/陪我|现在.*难受|先别讲道理/.test(text)){state.companion=true;state.events.push({time:'此刻',text:'暂时放下手头的事，抽空陪你聊一会儿'})}if(/我喜欢.{1,30}/.test(text)&&!state.memories.some(x=>x.text===text)){state.memories.push({id:Date.now(),text,source:'刚刚的原型聊天',kind:'普通偏好'});toast('示例：已保存偏好，可在记忆页纠正')}if(/明晚.*电影/.test(text)&&!state.pending.some(x=>x.type==='promise')){state.pending.push({id:Date.now(),text:'明晚一起看电影（时间待定）',type:'promise'})}render();queueReply()}
function saveProfile(e){e.preventDefault();const data=new FormData(e.target);for(const k of ['you','him','birthday','anniversary','wake','sleep'])state.profile[k]=String(data.get(k)||'').trim();persist();toast('称呼与作息已保存在本地');render()}
function photo(){if(state.scenario==='budget'||state.budget.used>=state.budget.limit){toast('预算已达上限，暂停图片');return}if(state.budget.used>=state.budget.limit*.8){toast('已接近预算上限，先保留聊天额度');return}if(state.week>=2){toast('本周已留下两张回忆，下周再继续');return}state.week++;state.photos.unshift({id:Date.now(),title:'今天，也想留一张',caption:'两杯饮料，一段共同想象的时光。原型构图示意，未调用生成服务。',date:'今天',kind:'cups'});persist();toast('已添加一张构图示意 · 没有真实消费');if(view==='gallery')render();else {addMessage('system','一张新的构图示意已保存到相册。');render()}}
function exportBackup(){const backup={format:'private-days-prototype',version:1,exportedAt:new Date().toISOString(),state,images:state.photos.map(p=>({id:p.id,src:art(p.kind)}))};const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='在你身边-原型备份.json';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(link.href),1000);toast('已导出本地示例备份')}
function validBackup(v){if(v?.format!=='private-days-prototype'||v.version!==1||v.state?.version!==1)return false;const s=v.state;return s.profile&&typeof s.profile.you==='string'&&typeof s.profile.him==='string'&&['messages','memories','pending','habits','notes','promises','events','photos'].every(k=>Array.isArray(s[k]))&&s.messages.every(m=>['you','him','system'].includes(m.role)&&typeof m.text==='string')&&s.memories.every(m=>typeof m.text==='string')&&s.pending.every(m=>typeof m.text==='string')&&s.habits.every(h=>typeof h.name==='string'&&Number.isFinite(h.count))&&s.notes.every(n=>typeof n.title==='string')&&s.promises.every(n=>typeof n.title==='string')&&s.events.every(n=>typeof n.text==='string')&&s.photos.every(p=>['cups','dolls','sky'].includes(p.kind)&&typeof p.title==='string')&&!!items[s.item]&&!!items[s.carrying]&&Number.isInteger(s.week)&&s.week>=0&&s.week<=2&&s.budget&&Number.isFinite(s.budget.limit)&&s.budget.limit>0&&Number.isFinite(s.budget.used)&&s.budget.used>=0&&['normal','busy','read','budget'].includes(s.scenario)}
async function restore(e){const f=e.target.files[0];if(!f)return;if(f.size>5*1024*1024){toast('文件过大，请选择原型导出的备份');return}try{const v=JSON.parse(await f.text());if(!validBackup(v))throw new Error('format');showModal('恢复本地备份',`<p>这会替换当前浏览器里的示例数据。建议先导出当前内容。</p><div class="button-row"><button class="secondary" data-action="close">取消</button><button class="primary" id="confirm-restore">确认替换</button></div>`);$('#confirm-restore').onclick=()=>{endWork();state=v.state;closeModal();render();toast('备份已恢复')}}catch{toast('备份格式不正确，当前数据没有改变')}e.target.value=''}
function demo(mode){closeModal();if(mode==='reset'){showModal('重置示例',`<p>将清除当前原型中的修改，恢复初始示例。正式应用的数据不会受到影响。</p><button class="primary full" id="confirm-reset">确认重置示例</button>`);$('#confirm-reset').onclick=()=>{endWork();state=seed();tab='日常记录';view='home';closeModal();render();toast('已恢复初始示例')};return}if(mode==='notification'){showModal('锁屏通知示意',`<div class="lock-preview"><div class="lock-time">16:08</div><p>10月15日 星期四</p><div class="lock-notification"><small>在你身边 · 现在</small><strong>你有一条新消息</strong></div></div><p class="muted">这是界面预览，不会申请系统权限或发出真实通知。</p>`);return}if(mode==='empty'){showModal('空白相册示意',`<div class="empty-state">${icon('album')}<h3>第一段回忆，正在路上</h3><p class="muted">还没有照片，也不必着急。</p><button class="primary" data-go="chat">去和他说说话</button></div><p class="muted">仅预览空状态，不删除现有照片。</p>`);return}endWork();state.companion=mode==='companion';state.scenario=mode==='companion'?'normal':mode;if(mode==='budget'){state.budget.used=state.budget.limit}else if(state.budget.used>=state.budget.limit){state.budget.used=12.6}if(mode==='companion')state.events.push({time:'此刻',text:'抽空陪你聊一会儿'});if(mode==='normal')state.events.push({time:'此刻',text:'忙完手头的事，可以聊一会儿'});if(mode==='busy'||mode==='read')state.events.push({time:'此刻',text:mode==='busy'?'会议中，稍后查看消息':'处理工作，抽空查看了消息'});view='chat';render();toast('已切换演示状态')}
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;
if(el.dataset.go){nav(el.dataset.go);return}if(el.dataset.tab){tab=el.dataset.tab;render();return}if(el.dataset.demo){demo(el.dataset.demo);return}if(el.dataset.item){state.item=el.dataset.item;render();return}if(el.dataset.album){albumFilter=el.dataset.album;render();return}if(el.dataset.memoryFilter){memoryFilter=el.dataset.memoryFilter;render();return}
if(el.dataset.check){const h=state.habits.find(h=>h.id===Number(el.dataset.check));if(h){h.count++;render();toast(`${h.name}已记录，可以按自己的节奏来`) }return}
if(el.dataset.deleteNote){state.notes=state.notes.filter(n=>n.id!==Number(el.dataset.deleteNote));render();toast('安排已删除');return}
if(el.dataset.deleteMemory){const m=state.memories.find(m=>m.id===Number(el.dataset.deleteMemory));showModal('删除这条记忆',`<p>${esc(m?.text)}</p><p class="muted">将从有效记忆中移除；历史聊天不会一起删除。</p><button class="primary full" id="confirm-delete-memory">确认删除</button>`);$('#confirm-delete-memory').onclick=()=>{state.memories=state.memories.filter(m=>m.id!==Number(el.dataset.deleteMemory));closeModal();render();toast('已删除这条有效记忆')};return}
if(el.dataset.editMemory){const m=state.memories.find(m=>m.id===Number(el.dataset.editMemory));showModal('纠正记忆',`<form id="edit-memory-form"><label class="field">你希望他记住的内容<textarea name="memory" maxlength="300" required>${esc(m?.text)}</textarea></label><button class="primary full">保存修改</button></form>`);$('#edit-memory-form').onsubmit=e=>{e.preventDefault();const text=new FormData(e.target).get('memory').trim();if(!text)return;m.text=text;m.source='你的手动纠正';closeModal();render();toast('记忆已更新')};return}
if(el.dataset.confirm){const m=state.pending.find(m=>m.id===Number(el.dataset.confirm));if(!m)return;if(m.type==='promise'){showModal('确认共同约定',`<form id="promise-form"><label class="field">约定内容<input name="title" value="一起看电影" maxlength="60" required></label><label class="field">日期与时间<input name="time" type="datetime-local" required></label><button class="primary full">确认并留出时间</button></form>`);$('#promise-form').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target);const time=String(fd.get('time'));if(state.promises.some(x=>x.time===time.replace('T',' '))){toast('这个时间已有约定，请先调整');return}const title=String(fd.get('title')).trim();if(!title)return;state.promises.push({id:Date.now(),title,time:time.replace('T',' ')});state.memories.push({id:Date.now(),text:`${time.replace('T',' ')} ${title}`,source:'共同确认',kind:'重要约定'});state.pending=state.pending.filter(x=>x.id!==m.id);closeModal();render();toast('约定已确认，日程已留出时间')};}else{state.memories.push({id:Date.now(),text:m.text,source:'你的确认',kind:'日常事实'});state.pending=state.pending.filter(x=>x.id!==m.id);render()}return}
if(el.dataset.dismiss){state.pending=state.pending.filter(m=>m.id!==Number(el.dataset.dismiss));render();toast('没有保存为长期记忆');return}
if(el.dataset.photo){const p=state.photos.find(p=>p.id===Number(el.dataset.photo));showModal(esc(p.title),`<img src="${art(p.kind)}" alt="${esc(p.title)}"><p>${esc(p.caption)}</p><div class="detail-date">${esc(p.date)} · 构图示意</div>`);return}
if(el.dataset.retry){if(state.scenario==='budget'){toast('额度已用尽，暂停生成');return}const m=state.messages.find(m=>m.id===Number(el.dataset.retry));m.text=m.retry?'刚忙完，看到你的消息了。':'嗯，刚才那句重新说。今天有什么想和我分享的？';m.retry=!m.retry;render();toast('已替换最新回复；原型未从此回复生成额外记忆');return}
const action=el.dataset.action;if(!action)return;
if(action==='close')closeModal();
if(action==='companion'){state.companion=!state.companion;if(state.companion){state.events.push({time:'此刻',text:'暂时放下手头的事，抽空陪你聊一会儿'});addMessage('him','嗯，我在。想说就说。');if(pendingIds.length)queueReply()}render();toast(state.companion?'已进入陪伴模式':'已恢复日常节奏')}
if(action==='return'){state.scenario='normal';state.events.push({time:'此刻',text:'会议结束，回来查看你的消息'});if(pendingIds.length)queueReply();else{markRead();addMessage('him','忙完了。刚才留下的话，我都看到了。');render()}}
if(action==='mood'){showModal('记录此刻的心情',`<p class="muted">可以简单留一句，也可以直接去聊天。</p><div class="mood-options">${['开心','想你','平静','有点累','难过','幸运'].map(x=>`<button data-mood="${x}">${x}</button>`).join('')}</div><p class="muted">原型不限制每天记录次数。</p>`);$('#overlay').querySelectorAll('[data-mood]').forEach(b=>b.onclick=()=>{state.mood=b.dataset.mood==='想你'?'今天也有一点想你':`今天${b.dataset.mood}`;state.events.push({time:'此刻',text:`你记录了心情：${b.dataset.mood}`});closeModal();render();toast('心情已记录')})}
if(action==='add-habit'){showModal('添加自己的习惯',`<form id="habit-form"><label class="field">习惯名称<input name="habit" placeholder="例如：散步" maxlength="20" required></label><button class="primary full">添加习惯</button></form>`);$('#habit-form').onsubmit=e=>{e.preventDefault();const name=String(new FormData(e.target).get('habit')).trim();if(!name)return;state.habits.push({id:Date.now(),name,count:0});closeModal();render();toast('已添加习惯')}}
if(action==='add-note'){showModal('添加安排',`<form id="note-form"><label class="field">类型<select name="kind"><option>课表</option><option>考试</option><option>待办</option><option>重要安排</option></select></label><label class="field">内容<input name="title" required maxlength="60"></label><label class="field">日期与时间<input name="time" type="datetime-local" required></label><button class="primary full">保存安排</button></form>`);$('#note-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),title=String(f.get('title')).trim();if(!title)return;state.notes.push({id:Date.now(),title,kind:String(f.get('kind')),time:String(f.get('time')).replace('T',' ')});closeModal();render();toast('安排已保存')}}
if(action==='carry'){state.carrying=state.item;persist();toast(`下次就带上${items[state.item].name}`)}
if(action==='trip-preview'){const it=items[state.carrying];state.events.push({time:'傍晚',text:it.event});state.tripRun++;addMessage('him',it.message);persist();showModal('出行见闻 · 示例',`<span class="pill">携带物品：${it.name}</span><p>${it.event}</p><div class="bubble">${it.message}</div><button class="primary full section-gap" data-go="timeline">查看日常记录</button>`)}
if(action==='take-photo')photo();if(action==='export')exportBackup();if(action==='import')$('#restore-file').click();
});
render();
</script>
</body></html>
